id: robomaster_gfsk_receiver_noise
label: gfsk_receiver_noise
category: '[robomaster]'

templates:
  imports: from gnuradio import robomaster
  make: robomaster.gfsk_receiver_noise(${threshold}, ${sps}, ${packet_bytes})

parameters:
- id: threshold
  label: Threshold
  dtype: float
  default: '1500.0'
- id: sps
  label: Samples per Symbol
  dtype: int
  default: '52'
- id: packet_bytes
  label: Packet Bytes
  dtype: int
  default: '27'

inputs:
- label: in
  domain: stream
  dtype: float
  vlen: 1

outputs:
- label: out
  domain: stream
  dtype: byte

file_format: 1
